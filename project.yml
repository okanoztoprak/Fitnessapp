name: PowerUp
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: nl
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PowerCore:
    path: Packages/PowerCore
targets:
  PowerUp:
    type: application
    platform: iOS
    sources:
      - PowerUp
      - Shared
    dependencies:
      - package: PowerCore
      - target: PowerUpWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: POWER UP
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "POWER UP leest je voeding (ook uit MyFitnessPal), gewicht, slaap en stappen uit Apple Health om je verbruik, doelen en dagelijkse activiteit te tonen."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Alleen in testversies: POWER UP zet voorbeelddata in Apple Health."
        CODE_SIGN_ENTITLEMENTS: PowerUp/PowerUp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
  PowerUpWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: POWER UP
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "POWER UP leest je voeding (ook uit MyFitnessPal), gewicht, slaap en stappen uit Apple Health om je verbruik, doelen en dagelijkse activiteit te tonen."
schemes:
  PowerUp:
    build:
      targets:
        PowerUp: all
    run:
      config: Debug
